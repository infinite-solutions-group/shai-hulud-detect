name: supply-chain-deep-scan

# Reusable deep scan (non-blocking, scheduled). Installs dependencies best-effort so the
# IOC scanner sees installed node_modules (dropper files that only appear post-install),
# then runs the same OSV + Cobenian checks. A finding fails the scheduled run as an alert;
# it is NOT a required check, so it never blocks merges.
#   jobs:
#     deep:
#       if: github.event_name == 'schedule'
#       uses: infinite-solutions-group/shai-hulud-detect/.github/workflows/scan-deep.reusable.yml@<SHA>
#       permissions: { contents: read }

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: target

      - name: Checkout IOC scanner (pinned to this reusable workflow's commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: infinite-solutions-group/shai-hulud-detect
          ref: ${{ github.job_workflow_sha }}
          path: .sh-detect

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies (best-effort)
        working-directory: target
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install || true
          elif [ -f package.json ]; then
            npm install || true
          fi

      - name: OSV-Scanner (block on MALICIOUS packages; report CVEs)
        run: |
          set -euo pipefail
          OSV_VERSION="v2.3.8"
          OSV_SHA256="bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc"
          # Download + verify with retries. The checksum guard never relaxes:
          # curl -f fails on HTTP errors (instead of saving an error page), and the
          # loop re-downloads on a checksum mismatch too (catches truncated 200s).
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o osv-scanner \
              "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
              && echo "${OSV_SHA256}  osv-scanner" | sha256sum -c - && break
            echo "::warning::osv-scanner download/verify failed (attempt ${attempt}/5); retrying"
            rm -f osv-scanner; sleep $((attempt * 5))
          done
          # Hard gate: fail the job if we still do not have the exact pinned binary.
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan source --recursive --format json ./target > osv.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ] && [ "$rc" -ne 128 ]; then
            echo "::error::OSV-Scanner errored (rc=$rc)"; head -c 2000 osv.json || true; exit "$rc"
          fi
          if [ ! -s osv.json ]; then echo "OSV: no package sources found"; exit 0; fi
          mal=$(jq -r '[.results[]?.packages[]?.vulnerabilities[]? | (.id, (.aliases[]?))]
                        | map(select(startswith("MAL-"))) | unique | .[]' osv.json 2>/dev/null || true)
          if [ -n "$mal" ]; then
            echo "::error::OSV flagged MALICIOUS package advisories (supply-chain compromise):"
            echo "$mal"
            exit 1
          fi
          # Critical-severity known vulns also block; org-admin may bypass after review.
          crit=$(jq -r '[ .results[]?.packages[]? as $p
              | ( $p.vulnerabilities[]? | select(.database_specific.severity=="CRITICAL") | .id ),
                ( $p.groups[]?        | select(((.max_severity // "") | if . == "" then 0 else tonumber end) >= 9.0) | .ids[] )
            ] | unique | .[]' osv.json 2>/dev/null || true)
          if [ -n "$crit" ]; then
            echo "::error::OSV flagged CRITICAL-severity advisories (blocking; review, then org-admin bypass to override):"
            echo "$crit"
            exit 1
          fi
          total=$(jq '[.results[]?.packages[]?.vulnerabilities[]?.id] | unique | length' osv.json 2>/dev/null || echo 0)
          if [ "${total:-0}" -gt 0 ]; then
            echo "::warning::OSV found ${total} non-critical CVE/GHSA advisory(ies) - not blocking (Dependabot tracks these)."
          fi
          echo "OSV: no malicious or critical-severity advisories"

      - name: Shai-Hulud IOC deep scan (Cobenian, incl. node_modules)
        run: |
          set +e
          # Run from inside target so the detector's content sweep only scans the
          # repo under test, not its own checkout (.sh-detect ships malicious test
          # fixtures + signature strings that otherwise self-trigger false HIGH-risk).
          ( cd target && bash "${GITHUB_WORKSPACE}/.sh-detect/shai-hulud-detector.sh" . )
          rc=$?
          set -e
          case "$rc" in
            0) echo "Shai-Hulud IOC scan: clean" ;;
            1) echo "::error::Shai-Hulud HIGH-risk IOC findings"; exit 1 ;;
            2) echo "::warning::Shai-Hulud medium-risk findings (review)" ;;
            *) echo "::error::Shai-Hulud scanner errored (rc=$rc)"; exit "$rc" ;;
          esac
