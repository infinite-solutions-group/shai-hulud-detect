name: supply-chain-scan

# Reusable fast gate: OSV-Scanner (malicious/vulnerable versions, auto-updating from
# osv.dev) + Cobenian shai-hulud-detect (IOC artifacts: dropper hashes, poisoned
# workflows, exfil endpoints). Callers pin by commit SHA:
#   jobs:
#     supply-chain:
#       uses: infinite-solutions-group/shai-hulud-detect/.github/workflows/scan.reusable.yml@<SHA>
#       permissions: { contents: read }
# Status-check context is "supply-chain / scan" — require that in rulesets.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: target

      # Fail fast if the pinned ref is empty. github.job_workflow_sha normally holds
      # the exact commit this reusable workflow was called at, but it comes back EMPTY
      # on "Re-run failed jobs" for a reusable-workflow job. An empty ref makes
      # actions/checkout silently fall back to the scanner's DEFAULT BRANCH — both an
      # unpinned (unverified) scanner and a confusing failure mode, since checkout then
      # makes a "determine default branch" API call that turns transient GitHub
      # degradation into an opaque "No server is currently available" checkout error.
      # Guard here so the operator gets an actionable message instead.
      - name: Assert scanner ref is pinned
        run: |
          if [ -z "${{ github.job_workflow_sha }}" ]; then
            echo "::error::github.job_workflow_sha is empty, so the IOC scanner would be checked out from its default branch instead of the pinned commit. This happens on 'Re-run failed jobs' for a reusable workflow — re-run ALL jobs or push a fresh commit instead." >&2
            exit 1
          fi

      - name: Checkout IOC scanner (pinned to this reusable workflow's commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: infinite-solutions-group/shai-hulud-detect
          ref: ${{ github.job_workflow_sha }}
          path: .sh-detect

      - name: OSV-Scanner (block on MALICIOUS packages; report CVEs)
        run: |
          set -euo pipefail
          OSV_VERSION="v2.3.8"
          OSV_SHA256="bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc"
          # Download + verify with retries. The checksum guard never relaxes:
          # curl -f fails on HTTP errors (instead of saving an error page), and the
          # loop re-downloads on a checksum mismatch too (catches truncated 200s).
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o osv-scanner \
              "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
              && echo "${OSV_SHA256}  osv-scanner" | sha256sum -c - && break
            echo "::warning::osv-scanner download/verify failed (attempt ${attempt}/5); retrying"
            rm -f osv-scanner; sleep $((attempt * 5))
          done
          # Hard gate: fail the job if we still do not have the exact pinned binary.
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan source --recursive --format json ./target > osv.json
          rc=$?
          set -e
          # rc: 0 none, 1 advisories found, 128 no package sources; anything else = error
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ] && [ "$rc" -ne 128 ]; then
            echo "::error::OSV-Scanner errored (rc=$rc)"; head -c 2000 osv.json || true; exit "$rc"
          fi
          if [ ! -s osv.json ]; then echo "OSV: no package sources found"; exit 0; fi
          # Malicious packages carry MAL- identifiers (incl. aliases). Block only on those;
          # ordinary CVE/GHSA advisories are handled by Dependabot, not this merge gate.
          mal=$(jq -r '[.results[]?.packages[]?.vulnerabilities[]? | (.id, (.aliases[]?))]
                        | map(select(startswith("MAL-"))) | unique | .[]' osv.json 2>/dev/null || true)
          if [ -n "$mal" ]; then
            echo "::error::OSV flagged MALICIOUS package advisories (supply-chain compromise):"
            echo "$mal"
            exit 1
          fi
          # Critical-severity known vulns also block; org-admin may bypass after review.
          crit=$(jq -r '[ .results[]?.packages[]? as $p
              | ( $p.vulnerabilities[]? | select(.database_specific.severity=="CRITICAL") | .id ),
                ( $p.groups[]?        | select(((.max_severity // "") | if . == "" then 0 else tonumber end) >= 9.0) | .ids[] )
            ] | unique | .[]' osv.json 2>/dev/null || true)
          if [ -n "$crit" ]; then
            echo "::error::OSV flagged CRITICAL-severity advisories (blocking; review, then org-admin bypass to override):"
            echo "$crit"
            exit 1
          fi
          total=$(jq '[.results[]?.packages[]?.vulnerabilities[]?.id] | unique | length' osv.json 2>/dev/null || echo 0)
          if [ "${total:-0}" -gt 0 ]; then
            echo "::warning::OSV found ${total} non-critical CVE/GHSA advisory(ies) - not blocking (Dependabot tracks these)."
          fi
          echo "OSV: no malicious or critical-severity advisories"

      - name: Shai-Hulud IOC scan (Cobenian)
        run: |
          set +e
          # Move the scanner's own checkout out of the workspace before scanning, so the
          # detector's content sweep can't reach its bundled malicious test fixtures /
          # signature strings (false HIGH-risk) — while keeping the original ./target
          # invocation so real repos are scanned exactly as before (cd-into-target changed
          # the detector's file selection and over-flagged manifest repos).
          mv "${GITHUB_WORKSPACE}/.sh-detect" "${RUNNER_TEMP}/sh-detect"
          bash "${RUNNER_TEMP}/sh-detect/shai-hulud-detector.sh" ./target
          rc=$?
          mv "${RUNNER_TEMP}/sh-detect" "${GITHUB_WORKSPACE}/.sh-detect" || true
          set -e
          # 0 clean | 1 high-risk (block) | 2 medium-risk (warn, non-blocking) | >2 error
          case "$rc" in
            0) echo "Shai-Hulud IOC scan: clean" ;;
            1) echo "::error::Shai-Hulud HIGH-risk IOC findings"; exit 1 ;;
            2) echo "::warning::Shai-Hulud medium-risk findings (review; not blocking)" ;;
            *) echo "::error::Shai-Hulud scanner errored (rc=$rc)"; exit "$rc" ;;
          esac
