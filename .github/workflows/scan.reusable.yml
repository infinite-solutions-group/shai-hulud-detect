name: supply-chain-scan

# Reusable fast gate: OSV-Scanner (malicious/vulnerable versions, auto-updating from
# osv.dev) + Cobenian shai-hulud-detect (IOC artifacts: dropper hashes, poisoned
# workflows, exfil endpoints). Callers pin by commit SHA:
#   jobs:
#     supply-chain:
#       uses: infinite-solutions-group/shai-hulud-detect/.github/workflows/scan.reusable.yml@<SHA>
#       permissions: { contents: read }
# Status-check context is "supply-chain / scan" — require that in rulesets.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: target

      - name: Checkout IOC scanner (pinned to this reusable workflow's commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: infinite-solutions-group/shai-hulud-detect
          ref: ${{ github.job_workflow_sha }}
          path: .sh-detect

      - name: OSV-Scanner (block on MALICIOUS packages; report CVEs)
        run: |
          set -euo pipefail
          OSV_VERSION="v2.3.8"
          OSV_SHA256="bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc"
          curl -sSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan source --recursive --format json ./target > osv.json
          rc=$?
          set -e
          # rc: 0 none, 1 advisories found, 128 no package sources; anything else = error
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ] && [ "$rc" -ne 128 ]; then
            echo "::error::OSV-Scanner errored (rc=$rc)"; head -c 2000 osv.json || true; exit "$rc"
          fi
          if [ ! -s osv.json ]; then echo "OSV: no package sources found"; exit 0; fi
          # Malicious packages carry MAL- identifiers (incl. aliases). Block only on those;
          # ordinary CVE/GHSA advisories are handled by Dependabot, not this merge gate.
          mal=$(jq -r '[.results[]?.packages[]?.vulnerabilities[]? | (.id, (.aliases[]?))]
                        | map(select(startswith("MAL-"))) | unique | .[]' osv.json 2>/dev/null || true)
          total=$(jq '[.results[]?.packages[]?.vulnerabilities[]?.id] | unique | length' osv.json 2>/dev/null || echo 0)
          if [ -n "$mal" ]; then
            echo "::error::OSV flagged MALICIOUS package advisories (supply-chain compromise):"
            echo "$mal"
            exit 1
          fi
          if [ "${total:-0}" -gt 0 ]; then
            echo "::warning::OSV found ${total} known CVE/GHSA advisory(ies) - not blocking (tracked by Dependabot)."
          fi
          echo "OSV: no malicious packages detected"

      - name: Shai-Hulud IOC scan (Cobenian)
        run: |
          set +e
          bash .sh-detect/shai-hulud-detector.sh ./target
          rc=$?
          set -e
          # 0 clean | 1 high-risk (block) | 2 medium-risk (warn, non-blocking) | >2 error
          case "$rc" in
            0) echo "Shai-Hulud IOC scan: clean" ;;
            1) echo "::error::Shai-Hulud HIGH-risk IOC findings"; exit 1 ;;
            2) echo "::warning::Shai-Hulud medium-risk findings (review; not blocking)" ;;
            *) echo "::error::Shai-Hulud scanner errored (rc=$rc)"; exit "$rc" ;;
          esac
